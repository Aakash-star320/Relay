<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Relay API</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<style>
			:root { font-family: Arial, sans-serif; color-scheme: dark; background: #101419; color: #f3f5f7; }
			* { box-sizing: border-box; }
			body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; }
			main { width: min(540px, 100%); padding: 36px; border: 1px solid #2a3540; border-radius: 18px; background: #161c23; }
			h1 { margin: 0 0 12px; font-size: 28px; }
			p { color: #aab5c0; line-height: 1.6; }
			a { display: inline-block; margin-top: 14px; padding: 12px 18px; border-radius: 9px; background: #ff6b35; color: #17191c; font-weight: 700; text-decoration: none; }
			a:focus-visible { outline: 2px solid #7bb8ff; outline-offset: 3px; }
		</style>
	</head>
	<body>
		<main>
			<h1>Relay API</h1>
			<p>The API is running on port 8000. Open the frontend to build and inspect requests.</p>
			<a href="http://localhost:3000">Open Relay</a>
		</main>
	</body>
</html>
